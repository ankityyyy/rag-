apiVersion: apps/v1
kinde: Deployment

metadata:
  name: backend-deployment
  labels: 
    app: backend-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend-app


  template:    
    metadata:
      labels: 
        app: backend-app


    spec:
      containers:
        - name: backend-container
          image: ankitdockerd/rag-pdf-backend:1.1


          ports:
            - containerPort: 5000       
